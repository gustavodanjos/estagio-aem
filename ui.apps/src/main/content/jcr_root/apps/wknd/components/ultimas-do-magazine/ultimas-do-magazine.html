<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.css @ categories='wknd.components.ultimas-do-magazine'}"/>
<sly data-sly-use.model="com.adobe.aem.guides.wknd.core.models.UltimasDoMagazineModel"/>

<section class="wknd-ultimas-magazine" aria-labelledby="wknd-ultimas-magazine-heading" data-sly-test="${!model.empty || wcmmode.edit}">

    <div class="wknd-ultimas-magazine__empty-state" data-sly-test="${model.empty && wcmmode.edit}">
        <strong>Componente "Últimas do Magazine" sem artigos</strong>
        Nenhum artigo encontrado em /content/wknd/us/en/magazine. Publique artigos no Magazine para que apareçam aqui.
    </div>

    <sly data-sly-test="${!model.empty}">
        <header class="wknd-ultimas-magazine__header">
            <h2 id="wknd-ultimas-magazine-heading" class="wknd-ultimas-magazine__title">Últimas do Magazine</h2>
        </header>

        <ul class="wknd-ultimas-magazine__grid wknd-ultimas-magazine__grid--cols-${model.columns}" role="list">
            <li class="wknd-ultimas-magazine__item" data-sly-repeat.article="${model.articles}">
                <article class="wknd-magazine-card" aria-labelledby="card-title-${articleList.index}">
                    <figure class="wknd-magazine-card__image-container">
                        <img class="wknd-magazine-card__image" src="${article.imagePath}" alt="${article.title}" loading="lazy"/>
                        <span class="wknd-magazine-card__badge" role="status" aria-label="Artigo recente">RECENTE</span>
                    </figure>

                    <div class="wknd-magazine-card__content">
                        <header class="wknd-magazine-card__header">
                            <h3 id="card-title-${articleList.index}" class="wknd-magazine-card__title">${article.title}</h3>
                        </header>

                        <p class="wknd-magazine-card__description" data-sly-test="${article.description}">${article.description}</p>

                        <footer class="wknd-magazine-card__footer">
                            <time class="wknd-magazine-card__date" data-sly-test="${article.lastModified}" datetime="${article.lastModified}">${article.lastModified}</time>
                            <a class="wknd-magazine-card__link" href="${article.path}" aria-label="Ler matéria completa: ${article.title}">
                                <span>Ler Matéria</span>
                                <span class="wknd-magazine-card__arrow" aria-hidden="true">→</span>
                            </a>
                        </footer>
                    </div>
                </article>
            </li>
        </ul>
    </sly>

</section>
